<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajero</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #161a22;
    --panel-2: #1e232d;
    --border: #262c38;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b8cff;
    --accent-2: #3ecf8e;
    --burbuja-mia: #2a5bd7;
    --burbuja-otro: #1e232d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ---------- Aviso de estado de la base de datos ---------- */
  .db-banner {
    padding: 8px 16px;
    font-size: 0.82rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    display: none;
  }
  .db-banner.ok { background: rgba(62, 207, 142, 0.12); color: var(--accent-2); }
  .db-banner.error { background: rgba(255, 107, 107, 0.12); color: #ff8a8a; }
  .db-banner.checking { background: var(--panel); color: var(--muted); }

  /* ---------- Vista de login ---------- */
  #vista-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  .login-card h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .login-card .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .login-card label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .login-card input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .login-card button:hover { opacity: 0.92; }

  /* ---------- Vista de chat (estilo WhatsApp/Telegram) ---------- */
  #vista-chat {
    display: none;
    height: 100vh;
    height: 100dvh;
  }
  .app-shell {
    display: flex;
    height: 100%;
  }

  /* Barra lateral: lista de conversaciones */
  .sidebar {
    width: 340px;
    min-width: 280px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sidebar-header .titulo { font-weight: 700; font-size: 1.05rem; }
  .sidebar-header .yo {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .sidebar-header .yo b { color: var(--accent-2); }
  .btn-cambiar {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .btn-cambiar:hover { color: var(--text); border-color: var(--accent); }

  .nuevo-chat {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
  }
  .nuevo-chat input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    color: var(--text);
    font-size: 0.85rem;
  }
  .nuevo-chat input:focus { outline: none; border-color: var(--accent); }
  .nuevo-chat button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .lista-conversaciones {
    flex: 1;
    overflow-y: auto;
  }
  .conversacion {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .conversacion:hover { background: var(--panel-2); }
  .conversacion.activa { background: var(--panel-2); }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    color: white;
    flex-shrink: 0;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-info .fila-superior {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
  }
  .conv-info .nombre { font-weight: 600; font-size: 0.92rem; }
  .conv-info .hora { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
  .conv-info .preview {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lista-vacia { padding: 30px 20px; color: var(--muted); font-size: 0.85rem; text-align: center; }

  /* Panel principal de chat */
  .panel-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(91,140,255,0.04), transparent 40%),
      var(--bg);
  }
  .chat-vacio {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
    padding: 20px;
  }
  .chat-header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
  }
  .chat-header .btn-atras {
    display: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0 4px 0 0;
  }
  .chat-header .nombre-contacto { font-weight: 600; font-size: 0.98rem; }

  .mensajes {
    flex: 1;
    overflow-y: auto;
    padding: 18px 6% 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .separador-fecha {
    align-self: center;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 0.72rem;
    padding: 3px 12px;
    border-radius: 12px;
    margin: 12px 0 8px;
  }
  .burbuja {
    max-width: 68%;
    padding: 5px 9px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.3;
    word-break: break-word;
    white-space: pre-wrap;
    margin-bottom: 3px;
    position: relative;
    width: fit-content;
  }
  .burbuja.mia {
    align-self: flex-end;
    background: var(--burbuja-mia);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .burbuja.otro {
    align-self: flex-start;
    background: var(--burbuja-otro);
    color: var(--text);
    border-bottom-left-radius: 3px;
  }
  .burbuja .hora-burbuja {
    float: right;
    font-size: 0.65rem;
    opacity: 0.65;
    margin: 4px 0 -2px 8px;
    white-space: nowrap;
  }

  .caja-envio {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .caja-envio textarea {
    flex: 1;
    resize: none;
    max-height: 120px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
  }
  .caja-envio textarea:focus { outline: none; border-color: var(--accent); }
  .caja-envio button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .caja-envio button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Responsive: en pantallas pequeñas, sidebar y chat se alternan */
  @media (max-width: 760px) {
    .sidebar { width: 100%; min-width: 0; }
    .app-shell.chat-abierto .sidebar { display: none; }
    .app-shell:not(.chat-abierto) .panel-chat { display: none; }
    .chat-header .btn-atras { display: inline-block; }
    .mensajes { padding-left: 3%; padding-right: 3%; }
  }
</style>
</head>
<body>

<div id="aviso-db" class="db-banner"></div>

<!-- Vista de login / cambio de usuario -->
<div id="vista-login">
  <div class="login-card">
    <h1>💬 Mensajero</h1>
    <p class="subtitle">Demo de uso de Netlify Database</p>
    <label for="input-nombre">¿Cómo te llamas?</label>
    <input id="input-nombre" type="text" maxlength="40" placeholder="p. ej. manuel" autocomplete="off">
    <button id="btn-entrar">Entrar</button>
  </div>
</div>

<!-- Vista de chat -->
<div id="vista-chat">
  <div class="app-shell" id="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="titulo">Mensajero</div>
          <div class="yo">Conectado como <b id="etiqueta-usuario"></b></div>
        </div>
        <button class="btn-cambiar" id="btn-cambiar-usuario">Cambiar</button>
      </div>
      <div class="nuevo-chat">
        <input id="input-nuevo-chat" type="text" maxlength="40" placeholder="Nuevo chat con..." autocomplete="off">
        <button id="btn-nuevo-chat">Iniciar</button>
      </div>
      <div class="lista-conversaciones" id="lista-conversaciones">
        <div class="lista-vacia">Aún no tienes conversaciones.<br>Escribe un nombre arriba para empezar.</div>
      </div>
    </aside>

    <section class="panel-chat" id="panel-chat">
      <div class="chat-vacio" id="chat-vacio">Selecciona una conversación o inicia una nueva.</div>

      <div id="chat-activo" style="display:none; flex:1; flex-direction:column; min-height:0;">
        <div class="chat-header">
          <button class="btn-atras" id="btn-atras">←</button>
          <div class="avatar" id="avatar-contacto"></div>
          <div class="nombre-contacto" id="nombre-contacto"></div>
        </div>
        <div class="mensajes" id="mensajes"></div>
        <div class="caja-envio">
          <textarea id="input-mensaje" maxlength="1000" placeholder="Escribe un mensaje..." rows="1"></textarea>
          <button id="btn-enviar" title="Enviar">➤</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  const INTERVALO_RAPIDO_MS = 5000;     // mientras el usuario ha escrito hace <30s
  const INTERVALO_LENTO_MS = 10000;     // visible, pero ≥30s sin teclear
  const INTERVALO_FONDO_MS = 20000;     // pestaña oculta (no se para del todo, para no perder mensajes)
  const UMBRAL_INACTIVIDAD_MS = 30000;  // a partir de aquí se pasa a polling lento
  const INTERVALO_REINTENTO_DB_MS = 15000; // reintento de conexión cada 15s, solo si falló al inicio
  const CLAVE_USUARIO = 'mensajero_usuario';
  const COLORES_AVATAR = ['#5b8cff', '#3ecf8e', '#ff8a65', '#ba68c8', '#4dd0e1', '#f06292', '#ffca28', '#81c784'];

  // --- Referencias DOM ---
  const avisoDb = document.getElementById('aviso-db');
  const vistaLogin = document.getElementById('vista-login');
  const vistaChat = document.getElementById('vista-chat');
  const inputNombre = document.getElementById('input-nombre');
  const btnEntrar = document.getElementById('btn-entrar');
  const etiquetaUsuario = document.getElementById('etiqueta-usuario');
  const btnCambiarUsuario = document.getElementById('btn-cambiar-usuario');

  const inputNuevoChat = document.getElementById('input-nuevo-chat');
  const btnNuevoChat = document.getElementById('btn-nuevo-chat');
  const listaConversaciones = document.getElementById('lista-conversaciones');

  const appShell = document.getElementById('app-shell');
  const chatVacio = document.getElementById('chat-vacio');
  const chatActivo = document.getElementById('chat-activo');
  const avatarContacto = document.getElementById('avatar-contacto');
  const nombreContacto = document.getElementById('nombre-contacto');
  const btnAtras = document.getElementById('btn-atras');
  const mensajesEl = document.getElementById('mensajes');
  const inputMensaje = document.getElementById('input-mensaje');
  const btnEnviar = document.getElementById('btn-enviar');

  let usuarioActual = null;
  let todosLosMensajes = [];
  let contactoActivo = null;
  let idTemporizadorPolling = null;
  let ultimoTecleo = 0;
  let temporizadorReintentoDb = null;

  // Indicador de mensajes no leídos en el título de la pestaña
  const TITULO_BASE = document.title; // "Mensajero"
  let mensajesNoLeidos = 0;
  let idsMensajesConocidos = new Set();
  let primeraConsultaHecha = false;

  // ---------- Utilidades ----------
  function escaparHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }

  function colorParaNombre(nombre) {
    let hash = 0;
    for (let i = 0; i < nombre.length; i++) hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
    return COLORES_AVATAR[Math.abs(hash) % COLORES_AVATAR.length];
  }

  function inicial(nombre) {
    return (nombre[0] || '?').toUpperCase();
  }

  function formatearHoraCorta(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatearFechaSeparador(iso) {
    const d = new Date(iso);
    const hoy = new Date();
    const ayer = new Date(hoy); ayer.setDate(hoy.getDate() - 1);
    const mismodia = (a, b) => a.toDateString() === b.toDateString();
    if (mismodia(d, hoy)) return 'Hoy';
    if (mismodia(d, ayer)) return 'Ayer';
    return d.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // ---------- Aviso de estado de la base de datos ----------
  // Se comprueba UNA vez al arrancar. Si va bien, no se vuelve a comprobar
  // nunca más (se confía en que la conexión no se caiga). Si falla, se
  // avisa de forma persistente y se reintenta cada 15s hasta que funcione;
  // en cuanto funciona, se deja de comprobar definitivamente.
  async function consultarEstadoDbUnaVez() {
    try {
      const resp = await fetch('/api/estado');
      const datos = await resp.json();
      return !!(resp.ok && datos.ok) ? { ok: true } : { ok: false, error: datos.error || 'error desconocido' };
    } catch (err) {
      return { ok: false, error: err.message };
    }
  }

  async function comprobarBaseDeDatosAlInicio() {
    avisoDb.style.display = 'block';
    avisoDb.className = 'db-banner checking';
    avisoDb.textContent = 'Comprobando conexión con la base de datos…';

    const resultado = await consultarEstadoDbUnaVez();

    if (resultado.ok) {
      avisoDb.className = 'db-banner ok';
      avisoDb.textContent = '✓ Conexión con la base de datos correcta.';
      setTimeout(() => { avisoDb.style.display = 'none'; }, 3000);
      // No se programa ningún reintento: confiamos en que no se caerá.
      return;
    }

    // Falló: aviso persistente + reintentos cada 15s
    avisoDb.className = 'db-banner error';
    avisoDb.textContent = '✗ Fallo de conexión con la base de datos: ' + resultado.error;

    if (temporizadorReintentoDb) clearInterval(temporizadorReintentoDb);
    temporizadorReintentoDb = setInterval(async () => {
      const reintento = await consultarEstadoDbUnaVez();
      if (reintento.ok) {
        clearInterval(temporizadorReintentoDb);
        temporizadorReintentoDb = null;
        avisoDb.className = 'db-banner ok';
        avisoDb.textContent = '✓ Conexión con la base de datos restablecida.';
        setTimeout(() => { avisoDb.style.display = 'none'; }, 3000);
        // A partir de aquí, ya no se vuelve a comprobar.
      } else {
        avisoDb.className = 'db-banner error';
        avisoDb.textContent = '✗ Fallo de conexión con la base de datos: ' + reintento.error;
      }
    }, INTERVALO_REINTENTO_DB_MS);
  }

  // ---------- Login / cambio de usuario ----------
  // ---------- Polling adaptativo de mensajes ----------
  // - Pestaña oculta: sigue consultando, pero cada 20s (no se corta del todo,
  //   para no perder mensajes mientras está en segundo plano).
  // - Pestaña visible y el usuario ha escrito en los últimos 30s: cada 5s.
  // - Pestaña visible y lleva 30s o más sin teclear: cada 10s.
  function detenerPolling() {
    if (idTemporizadorPolling) {
      clearTimeout(idTemporizadorPolling);
      idTemporizadorPolling = null;
    }
  }

  function intervaloSegunActividad() {
    if (document.hidden) return INTERVALO_FONDO_MS;
    const inactivoDesdeTecleo = Date.now() - ultimoTecleo;
    return inactivoDesdeTecleo < UMBRAL_INACTIVIDAD_MS ? INTERVALO_RAPIDO_MS : INTERVALO_LENTO_MS;
  }

  async function cicloPolling() {
    if (!usuarioActual) {
      idTemporizadorPolling = null;
      return;
    }
    await consultarMensajes();
    idTemporizadorPolling = setTimeout(cicloPolling, intervaloSegunActividad());
  }

  function iniciarPolling() {
    detenerPolling();
    cicloPolling();
  }

  function actualizarTituloPestana() {
    document.title = mensajesNoLeidos > 0 ? `✉️ (${mensajesNoLeidos}) ${TITULO_BASE}` : TITULO_BASE;
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && usuarioActual) {
      mensajesNoLeidos = 0;
      actualizarTituloPestana();
      iniciarPolling(); // consulta inmediata al volver + reanuda con el ritmo que toque
    }
    // Al ocultarse no hace falta hacer nada: el ciclo en marcha recalculará
    // el intervalo a 20s en su siguiente vuelta.
  });

  function entrarComo(nombre) {
    usuarioActual = nombre;
    localStorage.setItem(CLAVE_USUARIO, nombre);
    etiquetaUsuario.textContent = nombre;
    vistaLogin.style.display = 'none';
    vistaChat.style.display = 'block';

    todosLosMensajes = [];
    contactoActivo = null;
    idsMensajesConocidos = new Set();
    primeraConsultaHecha = false;
    mensajesNoLeidos = 0;
    actualizarTituloPestana();
    mostrarChatVacio();
    renderizarListaConversaciones();

    ultimoTecleo = Date.now(); // arranca en modo rápido, como si se acabara de interactuar
    iniciarPolling();
  }

  function volverALogin() {
    detenerPolling();
    mensajesNoLeidos = 0;
    actualizarTituloPestana();
    vistaChat.style.display = 'none';
    vistaLogin.style.display = 'flex';
    inputNombre.value = usuarioActual || '';
    inputNombre.focus();
    inputNombre.select();
  }

  // ---------- Conversaciones ----------
  function otraParte(mensaje) {
    return mensaje.remitente === usuarioActual ? mensaje.destinatario : mensaje.remitente;
  }

  function construirConversaciones() {
    const mapa = new Map();
    for (const m of todosLosMensajes) {
      const contacto = otraParte(m);
      const existente = mapa.get(contacto);
      if (!existente || new Date(m.creado_en) > new Date(existente.creado_en)) {
        mapa.set(contacto, m);
      }
    }
    return Array.from(mapa.entries())
      .map(([contacto, ultimoMensaje]) => ({ contacto, ultimoMensaje }))
      .sort((a, b) => new Date(b.ultimoMensaje.creado_en) - new Date(a.ultimoMensaje.creado_en));
  }

  function renderizarListaConversaciones() {
    const conversaciones = construirConversaciones();

    // Si hay un contacto activo que aún no tiene mensajes (chat recién
    // iniciado desde "Nuevo chat"), lo mantenemos visible arriba del todo.
    const contactosExistentes = new Set(conversaciones.map(c => c.contacto));
    if (contactoActivo && !contactosExistentes.has(contactoActivo)) {
      conversaciones.unshift({ contacto: contactoActivo, ultimoMensaje: null });
    }

    if (conversaciones.length === 0) {
      listaConversaciones.innerHTML = '<div class="lista-vacia">Aún no tienes conversaciones.<br>Escribe un nombre arriba para empezar.</div>';
      return;
    }

    listaConversaciones.innerHTML = conversaciones.map(({ contacto, ultimoMensaje }) => {
      const activa = contacto === contactoActivo ? ' activa' : '';
      const preview = ultimoMensaje
        ? (ultimoMensaje.remitente === usuarioActual ? 'Tú: ' : '') + escaparHtml(ultimoMensaje.cuerpo)
        : 'Nueva conversación';
      const hora = ultimoMensaje ? formatearHoraCorta(ultimoMensaje.creado_en) : '';
      return `
        <div class="conversacion${activa}" data-contacto="${escaparHtml(contacto)}">
          <div class="avatar" style="background:${colorParaNombre(contacto)}">${escaparHtml(inicial(contacto))}</div>
          <div class="conv-info">
            <div class="fila-superior">
              <span class="nombre">${escaparHtml(contacto)}</span>
              <span class="hora">${hora}</span>
            </div>
            <div class="preview">${preview}</div>
          </div>
        </div>
      `;
    }).join('');

    listaConversaciones.querySelectorAll('.conversacion').forEach(el => {
      el.addEventListener('click', () => abrirConversacion(el.dataset.contacto));
    });
  }

  function mostrarChatVacio() {
    contactoActivo = null;
    chatVacio.style.display = 'flex';
    chatActivo.style.display = 'none';
    appShell.classList.remove('chat-abierto');
  }

  function abrirConversacion(contacto) {
    contactoActivo = contacto;
    chatVacio.style.display = 'none';
    chatActivo.style.display = 'flex';
    appShell.classList.add('chat-abierto');

    avatarContacto.textContent = inicial(contacto);
    avatarContacto.style.background = colorParaNombre(contacto);
    nombreContacto.textContent = contacto;

    renderizarListaConversaciones();
    renderizarHiloMensajes();
    inputMensaje.focus();
  }

  function renderizarHiloMensajes() {
    if (!contactoActivo) return;
    const hilo = todosLosMensajes
      .filter(m => otraParte(m) === contactoActivo)
      .sort((a, b) => new Date(a.creado_en) - new Date(b.creado_en));

    if (hilo.length === 0) {
      mensajesEl.innerHTML = '';
      return;
    }

    let html = '';
    let fechaAnterior = null;
    for (const m of hilo) {
      const fechaSeparador = formatearFechaSeparador(m.creado_en);
      if (fechaSeparador !== fechaAnterior) {
        html += `<div class="separador-fecha">${fechaSeparador}</div>`;
        fechaAnterior = fechaSeparador;
      }
      const mia = m.remitente === usuarioActual;
      html += `
        <div class="burbuja ${mia ? 'mia' : 'otro'}">
          ${escaparHtml(m.cuerpo)}
          <span class="hora-burbuja">${formatearHoraCorta(m.creado_en)}</span>
        </div>
      `;
    }
    mensajesEl.innerHTML = html;
    mensajesEl.scrollTop = mensajesEl.scrollHeight;
  }

  // ---------- Consultar mensajes (polling adaptativo) ----------
  async function consultarMensajes() {
    if (!usuarioActual) return;
    try {
      const resp = await fetch('/api/mensajes?usuario=' + encodeURIComponent(usuarioActual));
      const datos = await resp.json();
      if (!resp.ok) throw new Error(datos.detalle || datos.error || 'Error del servidor');

      const mensajesRecibidosDelServidor = Array.isArray(datos) ? datos : [];

      // Si la pestaña está oculta, contamos como "no leídos" los mensajes
      // recibidos (no los que hemos enviado nosotros) que no conocíamos ya.
      // La primera consulta tras entrar no cuenta, para no marcar como
      // "nuevo" todo el historial que ya existía.
      if (primeraConsultaHecha && document.hidden) {
        const nuevosRecibidos = mensajesRecibidosDelServidor.filter(m =>
          m.destinatario === usuarioActual &&
          m.remitente !== usuarioActual &&
          !idsMensajesConocidos.has(m.id)
        );
        if (nuevosRecibidos.length > 0) {
          mensajesNoLeidos += nuevosRecibidos.length;
          actualizarTituloPestana();
        }
      }

      idsMensajesConocidos = new Set(mensajesRecibidosDelServidor.map(m => m.id));
      primeraConsultaHecha = true;

      todosLosMensajes = mensajesRecibidosDelServidor;
      renderizarListaConversaciones();
      if (contactoActivo) renderizarHiloMensajes();
    } catch (err) {
      console.error('Error al consultar mensajes:', err);
      // No se reactiva la comprobación de estado de la base de datos aquí:
      // solo se comprueba al inicio, según lo pedido.
    }
  }

  // ---------- Enviar mensaje ----------
  async function enviarMensaje() {
    const mensaje = inputMensaje.value.trim();
    if (!mensaje || !contactoActivo) return;

    btnEnviar.disabled = true;
    try {
      const resp = await fetch('/api/enviar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ de: usuarioActual, para: contactoActivo, mensaje }),
      });
      const datos = await resp.json();
      if (!resp.ok) throw new Error(datos.detalle || datos.error || 'Error al enviar');

      inputMensaje.value = '';
      inputMensaje.style.height = 'auto';
      ultimoTecleo = Date.now(); // seguimos en modo rápido tras enviar
      // Reflejamos el mensaje al instante en la UI sin esperar al polling
      todosLosMensajes.push({
        id: datos.id,
        remitente: usuarioActual,
        destinatario: contactoActivo,
        cuerpo: mensaje,
        creado_en: datos.creado_en || new Date().toISOString(),
      });
      renderizarListaConversaciones();
      renderizarHiloMensajes();
    } catch (err) {
      console.error('Error al enviar mensaje:', err);
      alert('No se pudo enviar el mensaje: ' + err.message);
    } finally {
      btnEnviar.disabled = false;
    }
  }

  // ---------- Eventos ----------
  btnEntrar.addEventListener('click', () => {
    const nombre = inputNombre.value.trim();
    if (!nombre) { inputNombre.focus(); return; }
    entrarComo(nombre);
  });
  inputNombre.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnEntrar.click(); });

  btnCambiarUsuario.addEventListener('click', volverALogin);

  btnNuevoChat.addEventListener('click', () => {
    const contacto = inputNuevoChat.value.trim().slice(0, 40);
    if (!contacto) { inputNuevoChat.focus(); return; }
    if (contacto === usuarioActual) { alert('No puedes iniciar un chat contigo mismo.'); return; }
    inputNuevoChat.value = '';
    abrirConversacion(contacto);
  });
  inputNuevoChat.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnNuevoChat.click(); });

  btnAtras.addEventListener('click', mostrarChatVacio);

  btnEnviar.addEventListener('click', enviarMensaje);
  inputMensaje.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensaje(); }
  });
  inputMensaje.addEventListener('input', () => {
    ultimoTecleo = Date.now();
    inputMensaje.style.height = 'auto';
    inputMensaje.style.height = Math.min(inputMensaje.scrollHeight, 120) + 'px';
  });

  // ---------- Arranque ----------
  comprobarBaseDeDatosAlInicio();

  const guardado = localStorage.getItem(CLAVE_USUARIO);
  if (guardado) {
    inputNombre.value = guardado;
    entrarComo(guardado);
  } else {
    inputNombre.focus();
  }
})();
</script>
</body>
</html>
